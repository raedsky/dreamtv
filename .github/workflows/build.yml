name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source (first upload only)
        id: src
        run: |
          if [ -f source.tgz ]; then
            tar xzf source.tgz
            git rm -q source.tgz
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack project source"
            git push
          fi
          if [ -f settings.gradle.kts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No source yet"; fi

      - uses: actions/setup-java@v4
        if: steps.src.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.src.outputs.ok == 'true'

      - name: Signing key (optional)
        if: steps.src.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        if: steps.src.outputs.ok == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'mytvsign' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mytv' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.ok == 'true'
        with:
          name: MyTV-apk
          path: app/build/outputs/apk/release/*.apk

      # رابط تحميل مباشر ثابت للجوال/البوكس (بدون تسجيل دخول وبدون zip):
      # https://github.com/<owner>/<repo>/releases/latest/download/MyTV.apk
      - name: Publish direct download link
        if: steps.src.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" MyTV.apk
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest MyTV.apk --title "MyTV (latest)" \
            --notes "Latest build from ${GITHUB_SHA::7}" --latest
